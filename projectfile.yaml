$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-01"
  name: python
  summary: CPython runtime compiled with PGO and LTO
  title: B19/Python
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/gcc.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/vulnerabilities/pip-bundled.yaml
  - https://kiota.ch/b19/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
kind: SoftwareSourceCode
links:
  - label: B19/Python on Codeberg
    type: source-code
    url: https://codeberg.org/b19/python
  - label: B19/Python on GitHub
    type: source-code
    url: https://github.com/damian-buho/b19-python
  - label: B19/Python on kiota.ch
    type: source-code
    url: https://kiota.ch/b19/python
  - label: Issues on Codeberg
    type: bugs
    url: https://codeberg.org/b19/python/issues
  - label: Issues on GitHub
    type: bugs
    url: https://github.com/damian-buho/b19-python/issues
  - label: Packages on PyPI
    type: package-registry
    url: https://pypi.org/project/python/
org:
  b19:
    scaffold:
      root-stage: root
  projectfile:
    build:
      args:
        B19_PYTHON_SERIES: "3.14"
    ci:
      image: b19/python-{B19_PYTHON_SERIES}
      matrix:
        axes:
          B19_PYTHON_SERIES:
            - "3.12"
            - "3.13"
            - "3.14"
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
repositories:
  - issues: true
    role: mirror
    type: git
    url: ssh://git@codeberg.org/b19/python.git
  - role: mirror
    type: git
    url: git@github.com:damian-buho/b19-python.git
  - role: origin
    type: git
    url: ssh://git@kiota.ch/b19/python.git
