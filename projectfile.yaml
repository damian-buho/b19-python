  title: B19 / Python
  description:
    en: Community-maintained distribution of CPython built on B19/Ubuntu. This repository holds only the packaging — Dockerfile, build scripts, and configuration, all MIT-licensed; the upstream CPython is fetched at build time and retains its own licensing.
    es: Distribución de CPython mantenida por la comunidad, construida sobre B19/Ubuntu. Este repositorio contiene únicamente el empaquetado — Dockerfile, scripts de compilación y configuración, todo con licencia MIT; el código original de CPython se obtiene en tiempo de compilación y conserva su propia licencia.
    uk: Дистрибуція CPython з підтримкою спільноти, зібрана на основі B19/Ubuntu. Цей репозиторій містить лише пакування — Dockerfile, скрипти збирання та конфігурацію, усе під ліцензією MIT; вихідний код CPython отримують під час збирання, і він зберігає власну ліцензію.
