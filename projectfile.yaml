org:
  b19:
    scaffold:
      root-stage: root
  projectfile:
    architecture:
      - amd64
      - arm64
    build:
      args:
        B19_PYTHON_SERIES: "3.14"
    image:
      series: "{B19_PYTHON_SERIES}"
      path: ${org}/${name}-${series}
      flatpath: ${org}-${name}-${series}
    ci:
      image: b19/python-{B19_PYTHON_SERIES}
      matrix:
        axes:
          B19_PYTHON_SERIES:
            - "3.12"
            - "3.13"
            - "3.14"
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
