$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-01"
  name: python
  summary:
    en: Community-maintained distribution of CPython based on B19/Ubuntu
    es: Distribución de CPython mantenida por la comunidad, basada en B19/Ubuntu
    uk: Дистрибуція CPython з підтримкою спільноти на основі B19/Ubuntu
  title: B19 / Python
  description:
    en: CPython compiled from source with pre-activated venv and uv-first defaults — automatic uv sync and bytecode compilation.
    es: CPython compilado desde fuente con venv preactivado y valores uv-first — sincronización uv automática y compilación de bytecode.
    uk: CPython із джерел з попередньо активованим venv і налаштуваннями uv-first — автоматичний uv sync і компіляція байткоду.
  version: 0.8.1
  released: "2026-10-11"
  visibility: public
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/gcc.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/traits/image/release.yaml
  - .makefile/container/traits/image/variant.yaml
  - https://kiota.ch/b19/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/forge/github.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/registry/dockerhub.yaml
keywords:
  - python
  - cpython
  - uv
  - venv
  - pip
kind: SoftwareSourceCode
links:
  - label:
      en: Repository on GitHub
      es: Repositorio en GitHub
      uk: Репозиторій на GitHub
    priority: 80
    tags:
      - public
      - badges
      - badges-github
    type: source-code
    url: https://github.com/damian-buho/b19-python
  - label:
      en: Issues on GitHub
      es: Incidencias en GitHub
      uk: Задачі на GitHub
    priority: 80
    tags:
      - support
    type: bugs
    url: https://github.com/damian-buho/b19-python/issues
  - label:
      en: Repository on kiota.ch
      es: Repositorio en kiota.ch
      uk: Репозиторій на kiota.ch
    preferred: true
    priority: 10
    type: source-code
    url: https://kiota.ch/b19/python
  - label:
      en: Packages on Docker Hub
      es: Paquetes en Docker Hub
      uk: Пакунки на Docker Hub
    type: package-registry
    url: https://hub.docker.com/r/damianbuho/b19-python
  - label:
      en: Packages on GHCR
      es: Paquetes en GHCR
      uk: Пакунки на GHCR
    type: package-registry
    url: https://github.com/damian-buho/b19-python/pkgs/container/b19%2Fpython
org:
  b19:
    scaffold:
      root-stage: root
  projectfile:
    architecture:
      - amd64
      - arm64
    build:
      args:
        B19_PYTHON_SERIES: "3.15"
    image:
      series: "py{B19_PYTHON_SERIES}"
      tag: ${series}
      variant:
        parts:
          - series
    ci:
      matrix:
        axes:
          B19_PYTHON_SERIES:
            - "3.12"
            - "3.13"
            - "3.14"
            - "3.15"
      nodes:
        image-is-built:
          # Source compile saturates the runner: chain the series, an edge both forges honour.
          serialise: B19_PYTHON_SERIES
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    status: maintained
repositories:
  - role: mirror
    type: git
    url: git@github.com:damian-buho/b19-python.git
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/b19/python.git
technologies:
  - python
